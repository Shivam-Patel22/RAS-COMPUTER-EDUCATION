---
deployment:
  tasks:
    - export SRC=/home/faesgvfk/RAS-COMPUTER-EDUCATION
    - export DEST=/home/faesgvfk/cdac-class-website
    - export BACKUP=/home/faesgvfk/rascomputer-deploy-backups/$(/bin/date +%Y%m%d-%H%M%S)

    # Validate required directories
    - /bin/test -d "$SRC/templates"
    - /bin/test -d "$DEST/templates"
    - /bin/test -d "$SRC/accounts"
    - /bin/test -d "$SRC/certificates"
    - /bin/test -d "$SRC/core"
    - /bin/test -d "$SRC/courses"
    - /bin/test -d "$SRC/dashboard"
    - /bin/test -d "$SRC/static"
    - /bin/test -f "$SRC/computer_class_site/urls.py"

    # Back up current live files
    - /bin/mkdir -p "$BACKUP/computer_class_site"
    - /bin/cp -Rp "$DEST/templates" "$DEST/accounts" "$DEST/certificates" "$DEST/core" "$DEST/courses" "$DEST/dashboard" "$DEST/static" "$BACKUP/"
    - /bin/cp -p "$DEST/computer_class_site/urls.py" "$BACKUP/computer_class_site/urls.py"
    - /bin/cp -p "$DEST/passenger_wsgi.py" "$BACKUP/passenger_wsgi.py" 2>/dev/null || true

    # Deploy templates and application modules
    - /bin/cp -Rp "$SRC/templates/." "$DEST/templates/"
    - /bin/cp -Rp "$SRC/accounts/." "$DEST/accounts/"
    - /bin/cp -Rp "$SRC/certificates/." "$DEST/certificates/"
    - /bin/cp -Rp "$SRC/core/." "$DEST/core/"
    - /bin/cp -Rp "$SRC/courses/." "$DEST/courses/"
    - /bin/cp -Rp "$SRC/dashboard/." "$DEST/dashboard/"
    - /bin/cp -p "$SRC/computer_class_site/urls.py" "$DEST/computer_class_site/urls.py"
    - /bin/cp -p "$SRC/passenger_wsgi.py" "$DEST/passenger_wsgi.py"
    - /bin/cp -p "$SRC/passanger_wsgi.py" "$DEST/passanger_wsgi.py" 2>/dev/null || true

    # Deploy static assets
    - /bin/cp -Rp "$SRC/static/." "$DEST/static/"

    # Run database migrations
    - /home/faesgvfk/virtualenv/cdac-class-website/3.12/bin/python "$DEST/manage.py" migrate --noinput

    # Collect static files
    - /home/faesgvfk/virtualenv/cdac-class-website/3.12/bin/python "$DEST/manage.py" collectstatic --noinput

    # Restart application
    - /bin/mkdir -p "$DEST/tmp"
    - /bin/touch "$DEST/tmp/restart.txt"
