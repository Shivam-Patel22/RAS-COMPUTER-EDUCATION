<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>500 - Server Error | RAS Computer Education</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .error-container {
            max-width: 650px;
            margin: 5rem auto;
            text-align: center;
            padding: 2rem;
            background: var(--card-bg, #ffffff);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
    </style>
</head>
<body style="background: var(--bg-light, #f8fafc); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; font-family: var(--font-body, 'Plus Jakarta Sans', 'Noto Sans Gujarati', 'Noto Sans Devanagari', 'Shruti', 'Nirmala UI', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif);">
    <div class="error-container">
        <div style="font-size: 4.5rem; line-height: 1; margin-bottom: 1.25rem;">⚠️</div>
        <h1 style="font-size: 2rem; color: #1e293b; margin: 0 0 0.75rem 0;">Server Error</h1>
        <p style="color: #64748b; font-size: 1rem; line-height: 1.6; margin-bottom: 2rem;">
            Something went wrong on our end while processing your request. Please try again shortly, or return to our homepage.
        </p>
        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="/" class="btn btn-primary" style="padding: 0.75rem 1.5rem; text-decoration: none; border-radius: 8px; font-weight: 600;">Return to Homepage &rarr;</a>
        </div>
    </div>
</body>
</html>
